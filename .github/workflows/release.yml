name: Release

# v* 태그를 푸시하면 Windows 설치 파일을 빌드해 GitHub Release로 올린다.
# Actions 탭에서 수동 실행하면 Release 없이 설치 파일만 아티팩트로 만든다 (빌드 확인용).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($PKG_VERSION)이 다릅니다."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build installer
        run: pnpm run build && pnpm exec electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SnapTidy-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "SnapTidy $GITHUB_REF_NAME" --generate-notes
