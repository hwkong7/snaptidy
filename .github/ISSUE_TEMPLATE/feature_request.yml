name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경
      description: 어떤 불편함이나 필요가 있는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작을 구체적으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
